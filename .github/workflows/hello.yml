name: Hello World
on:
  push:
    branches:
      - main
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show OS info
        run: uname -a

      - name: Show current user
        run: whoami

      - name: Show working directory
        run: pwd

      - name: Create a file and read it
        run: |
          echo "Hello from step 1" > test.txt
          cat test.txt